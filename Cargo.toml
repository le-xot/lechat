[package]
name = "lechat"
version = "1.0.2"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["http", "image", "webp"] }
image = { version = "0.25", features = ["png", "jpeg", "webp", "gif"] }
image-webp = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate"] }
fontdb = "0.24"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
